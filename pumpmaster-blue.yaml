apiVersion: apps/v1kind: Deployment
metadata:
  name: pumpmaster-blue
  labels:
    app: pumpmaster-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pumpmaster-blue
  template:
    metadata:
      labels:
        app: pumpmaster-blue
    spec:
      containers:
      - name: pumpmaster-api
        image: informagregistry.azurecr.io/pumpmaster-api:latest
        ports:
        - containerPort: 80
